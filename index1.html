<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan di Pulau</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea:#1fa3e0;--leaf:#3fa34d;--wood:#8a5a2b;--wood2:#e0a04a;--sun:#ffd84d;--red:#d62f2f;--ink:#3a2a1a;--paper:#fff7e6;--paper2:#f6e5c2;--ok:#b9e5a8;--no:#f7c0b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff1d6;--paper:#3b2a1a;--paper2:#4d3822;--ok:#2f6a2a;--no:#7a2c24}}
:root[data-theme="dark"]{--ink:#fff1d6;--paper:#3b2a1a;--paper2:#4d3822;--ok:#2f6a2a;--no:#7a2c24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#8fd8ff,#d9f3ff 45%,var(--sea) 46%,#0f78b5);overflow-x:hidden}
h1,h2,.btn,.sign{font-family:'Lilita One',Impact,sans-serif;font-weight:400}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cloud{animation:cl 50s linear infinite}.c2{animation-duration:75s;animation-delay:-30s}
@keyframes cl{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.wv{animation:wv 4s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-30px)}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:14px 14px 90px}
.sign{background:linear-gradient(var(--wood2),#c98a3a);color:#fff;border:4px solid var(--wood);border-radius:18px;text-align:center;padding:8px 14px;text-shadow:0 2px 0 var(--wood);box-shadow:0 5px 0 var(--wood)}
.sign h1{font-size:clamp(1.8rem,6vw,3rem);margin:0;color:#fff}.sign small{display:block;font:800 clamp(.85rem,2.5vw,1.1rem) Nunito;color:#fff4d6}
.panel{margin-top:16px;background:var(--paper);border:4px solid var(--wood);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--wood);animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:clamp(1.4rem,4.5vw,2rem);margin:0 0 8px;color:var(--red)}
p{margin:6px 0}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.dika{width:110px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.say{flex:1;min-width:200px;background:#fff;color:#3a2a1a;border:3px solid var(--wood);border-radius:16px;padding:10px 14px;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.25rem;color:#fff;text-shadow:0 2px 0 var(--wood);background:linear-gradient(var(--wood2),#c98a3a);border:4px solid var(--wood);border-radius:999px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 var(--wood);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--wood)}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--sun)}
.btn.big{font-size:1.6rem;padding:14px 34px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.card{background:var(--paper2);border:3px solid var(--wood);border-radius:16px;padding:12px;font-weight:700}
.card b{display:block;color:var(--red);margin-bottom:4px}
.ico{display:flex;gap:10px;justify-content:center;font-size:clamp(2.4rem,9vw,3.6rem);margin:12px 0;background:linear-gradient(#bfeaff,#e9f8ff);border:3px solid var(--wood);border-radius:16px;padding:8px}
.ico span{animation:bob 2.2s ease-in-out infinite}.ico span:nth-child(2){animation-delay:-.5s}.ico span:nth-child(3){animation-delay:-1s}.ico span:nth-child(4){animation-delay:-1.5s}
.hl{background:var(--sun);color:#3a2a1a;border-radius:8px;padding:0 6px;font-weight:800}
.key{margin-top:10px;background:var(--sun);color:#3a2a1a;border-radius:14px;padding:10px 14px;font-weight:800}
.opt{display:block;width:100%;text-align:left;font:800 1.1rem Nunito,sans-serif;color:var(--ink);background:var(--paper2);border:3px solid var(--wood);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.vid{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#1b6f9c,#3fa34d);border:4px dashed #fff;border-radius:16px;color:#fff;font-weight:800;padding:12px}
.play{font-size:4rem}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--paper2);border:2px solid var(--wood)}.dots i.on{background:var(--red)}
.score{font:400 3rem 'Lilita One',sans-serif;color:var(--red)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.conf{display:none}}
</style>
</head>
<body>
<svg id="bg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
 <circle cx="800" cy="80" r="42" fill="#ffd84d"/>
 <g class="cloud"><ellipse cx="0" cy="90" rx="60" ry="16" fill="#fff" opacity=".85"/><ellipse cx="30" cy="78" rx="34" ry="14" fill="#fff" opacity=".85"/></g>
 <g class="cloud c2"><ellipse cx="0" cy="150" rx="70" ry="16" fill="#fff" opacity=".75"/><ellipse cx="-30" cy="138" rx="36" ry="13" fill="#fff" opacity=".75"/></g>
 <path d="M120 380 L230 250 L340 380z" fill="#6b8f4e"/><path d="M200 280 L230 250 L260 280z" fill="#d6552a"/>
 <g class="wv"><path d="M0 400q40-14 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" fill="none" stroke="#ffffff66" stroke-width="3"/><path d="M-30 470q40-14 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0" fill="none" stroke="#ffffff55" stroke-width="3"/></g>
 <path d="M60 520q200-130 420-120t360 120z" fill="#e8cf8f"/><path d="M110 480q120-60 260-50t80 50z" fill="#3fa34d"/>
 <rect x="640" y="330" width="26" height="70" fill="#9aa7b3"/><rect x="672" y="310" width="30" height="90" fill="#b4c0cb"/><rect x="708" y="345" width="24" height="55" fill="#9aa7b3"/><path d="M560 400q50-45 100 0" fill="none" stroke="#c0392b" stroke-width="5"/>
</svg>
<div class="wrap">
 <div class="sign"><h1>Petualangan di Pulau</h1><small>IPAS Kelas 4 Semester 1 · Ketampakan Alam Alami dan Buatan</small></div>
 <main id="view" aria-live="polite"></main>
</div>
<script>
var MATERI=[
{t:"Mengenal ketampakan alam",ico:["🏝️","🌋","🌉","🏢"],p:"Ketampakan alam adalah pemandangan yang tampak di permukaan bumi. Ada yang terbentuk oleh alam, disebut <span class=hl>alami</span>. Ada yang dibuat manusia, disebut <span class=hl>buatan</span>.",k:"Alami dibentuk alam, buatan dibuat manusia.",say:"Pos 1 untuk yang alami, Pos 2 untuk yang buatan. Ayo kita jelajahi!"},
{t:"Alami: daratan",ico:["🌋","⛰️","🌳","🌾"],p:"Gunung, gunung berapi, bukit, dataran, dan hutan terbentuk oleh alam. Tidak ada yang membangunnya.",k:"Daratan alami bukan buatan manusia.",say:"Coba lihat gunung berapi di pulau ini!"},
{t:"Alami: perairan",ico:["🏞️","🌊","💧","🐟"],p:"Sungai, danau, laut, dan air terjun juga terbentuk oleh alam.",k:"Perairan alami ada karena alam.",say:"Airnya mengalir sendiri, bukan dibuat manusia."},
{t:"Ketampakan alam buatan",ico:["🌉","🏢","🛣️","⚓"],p:"Jembatan, gedung, jalan, pelabuhan, dan bendungan atau waduk dibuat manusia untuk memenuhi kebutuhan.",k:"Buatan dibangun oleh manusia.",say:"Di Pos 2 ada banyak bangunan hasil karya manusia."},
{t:"Alami atau buatan?",sort:1,p:"Tanyakan pada dirimu: siapa yang membentuknya, alam atau manusia? Coba pilah contoh di bawah ini.",k:"Bedakan, lalu jaga keduanya. Buang sampah pada tempatnya!",say:"Pilih Alami atau Buatan untuk tiap gambar."}];
var SORT=[["🌋","Gunung berapi","a"],["🌉","Jembatan","b"],["🏞️","Sungai","a"],["🏢","Gedung","b"],["🌳","Hutan","a"],["🏗️","Waduk","b"]];
var Q=[
{q:"Ketampakan alam alami adalah ketampakan yang…",o:["dibangun manusia dari bahan bangunan","hanya ada di kota","terbentuk oleh alam tanpa dibuat manusia"],c:2,h:"Alami berarti sudah ada karena alam, bukan dibangun manusia.",w:"Alami berarti dibentuk oleh alam.",m:0},
{q:"Manakah yang termasuk ketampakan alam buatan?",o:["Jembatan","Gunung","Air terjun"],c:0,h:"Gunung dan air terjun sudah ada karena alam. Cari yang dibangun manusia.",w:"Jembatan dibangun oleh manusia.",m:3},
{q:"Pasangan ketampakan alam alami yang benar adalah…",o:["gedung dan jalan","sungai dan danau","bendungan dan jembatan"],c:1,h:"Gedung, jalan, bendungan, dan jembatan dibuat manusia.",w:"Sungai dan danau terbentuk oleh alam.",m:2},
{q:"Manakah yang bukan ketampakan alam alami?",o:["Sungai","Hutan","Waduk"],c:2,h:"Tanyakan: siapa yang membentuknya, alam atau manusia?",w:"Waduk dibuat manusia.",m:4},
{q:"Cara yang tepat menjaga sungai dan taman kota adalah…",o:["membuang sampah pada tempatnya","membuang sampah ke sungai","mencoret fasilitas umum"],c:0,h:"Pilih tindakan yang membuat lingkungan tetap bersih.",w:"Sampah pada tempatnya menjaga alam dan fasilitas umum.",m:4},
{q:"Air terjun termasuk ketampakan alam…",o:["buatan","alami","yang dibangun di kota"],c:1,h:"Tanyakan: siapa yang membentuk air terjun, alam atau manusia?",w:"Air terjun terbentuk oleh alam, jadi termasuk alami.",m:2},
{q:"Ketampakan alam buatan dibuat manusia untuk…",o:["menghalangi pemandangan","menghilangkan semua hutan","memenuhi kebutuhan manusia"],c:2,h:"Pikirkan untuk apa manusia membangun jembatan, jalan, dan gedung.",w:"Jembatan, jalan, dan gedung dibuat manusia untuk memenuhi kebutuhan.",m:3},
{q:"Dika melihat laut dan danau. Ketampakan alam itu termasuk…",o:["perairan alami","daratan buatan","perairan buatan"],c:0,h:"Laut dan danau ada di air. Siapa yang membentuknya, alam atau manusia?",w:"Laut dan danau terbentuk oleh alam, jadi termasuk perairan alami.",m:2},
{q:"Pasangan yang semuanya ketampakan alam buatan adalah…",o:["gunung dan jalan","jembatan, gedung, dan jalan","hutan dan gedung"],c:1,h:"Cari pasangan yang semuanya dibangun manusia, tanpa ada yang dari alam.",w:"Jembatan, gedung, dan jalan semuanya dibuat manusia.",m:3}];
var L="ABC",missed={},view=document.getElementById("view");
function dika(){return '<svg class="dika" viewBox="0 0 100 130" role="img" aria-label="Dika, siswa penjelajah"><rect x="62" y="62" width="26" height="40" rx="8" fill="#8a5a2b"/><rect x="30" y="60" width="40" height="44" rx="10" fill="#e8d3a0"/><path d="M40 60l10 14 10-14z" fill="#d62f2f"/><rect x="34" y="102" width="12" height="18" fill="#f2b88a"/><rect x="54" y="102" width="12" height="18" fill="#f2b88a"/><rect x="30" y="100" width="18" height="12" rx="4" fill="#8a5a2b"/><rect x="52" y="100" width="18" height="12" rx="4" fill="#8a5a2b"/><circle cx="50" cy="40" r="22" fill="#f2b88a"/><path d="M28 36q22-26 44 0q-22-8-44 0z" fill="#2b1d12"/><ellipse cx="50" cy="24" rx="32" ry="8" fill="#e8d3a0"/><path d="M32 24q18-24 36 0z" fill="#e8d3a0"/><circle cx="42" cy="42" r="3.5" fill="#2b1d12"/><circle cx="58" cy="42" r="3.5" fill="#2b1d12"/><path d="M42 50q8 8 16 0" fill="none" stroke="#a0442c" stroke-width="3" stroke-linecap="round"/></svg>'}
function say(t){return '<div class="row"><div class="say">'+t+'</div>'+dika()+'</div>'}
function btn(l,a,cls){return '<button class="btn '+(cls||"")+'" data-a="'+a+'">'+l+'</button>'}
function show(h){view.innerHTML='<section class="panel">'+h+'</section>';view.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(b.dataset.a)}});window.scrollTo({top:0,behavior:"smooth"})}
function act(a){var p=a.split(":");if(p[0]=="cover")cover();else if(p[0]=="menu")menu();else if(p[0]=="goal")goal();else if(p[0]=="video")video();else if(p[0]=="mat")mat(+p[1],p[2]===undefined?-1:+p[2]);else if(p[0]=="quiz"){if(p[1]=="0"&&p[2]=="new")missed={};quiz(+p[1])}else if(p[0]=="end")end()}
function cover(){show('<h2>Selamat datang, penjelajah!</h2>'+say("Aku Dika. Ayo berlayar ke pulau yang punya ketampakan alam alami dan buatan, lalu kumpulkan pengetahuan di setiap pos!")+'<p style="text-align:center;margin-top:16px">'+btn("MULAI ▶","menu","big")+'</p><p style="text-align:center;font-weight:800">Disusun oleh Rini Hermawati</p>')}
function menu(){show('<h2>Peta Petualangan</h2>'+say("Pilih tujuanmu. Kalau belum tahu, mulai dari Tujuan lalu Materi.")+'<div class="grid">'+btn("🧭 TUJUAN","goal")+btn("📖 MATERI","mat:0")+btn("❓ KUIS","quiz:0:new")+btn("🎬 VIDEO","video")+'</div>')}
function goal(){show('<h2>Tujuan Pembelajaran</h2><div class="grid"><div class="card"><b>Tujuan 1</b>Menjelaskan arti ketampakan alam alami dan buatan beserta cirinya.</div><div class="card"><b>Tujuan 2</b>Mengelompokkan contoh ketampakan alam ke dalam alami atau buatan.</div><div class="card"><b>Tujuan 3</b>Menyebutkan cara menjaga ketampakan alam di lingkungan sekitar.</div></div><div class="nav">'+btn("◀ MENU","menu")+btn("MATERI ▶","mat:0")+'</div>')}
function video(){show('<h2>Video Pembelajaran</h2><div class="vid"><div><div class="play">▶</div>Video belum dipasang.<br>Tempat ini disiapkan untuk video dari guru.</div></div><div class="nav">'+btn("◀ MENU","menu")+'</div>')}
function mat(i,back){var m=MATERI[i],h='<h2>Materi '+(i+1)+': '+m.t+'</h2>';
 h+=say(m.say)+(m.ico?'<div class="ico">'+m.ico.map(function(e){return "<span>"+e+"</span>"}).join("")+'</div>':'');
 h+='<p>'+m.p+'</p>';
 if(m.sort){h+='<div id="sort"></div>'}
 h+='<div class="key">⭐ '+m.k+'</div><div class="dots">'+MATERI.map(function(x,j){return '<i class="'+(j==i?"on":"")+'"></i>'}).join("")+'</div><div class="nav">';
 if(back>=0)h+=btn("◀ KEMBALI KE SOAL","quiz:"+back);
 else{h+=btn("◀ "+(i?"KEMBALI":"MENU"),i?"mat:"+(i-1):"menu");h+=i<4?btn("LANJUT ▶","mat:"+(i+1)):btn("KUIS ▶","quiz:0:new")}
 show(h+'</div>');if(m.sort)sort(0,0)}
function sort(n,s){var box=document.getElementById("sort");if(!box)return;
 if(n>=SORT.length){box.innerHTML='<div class="fb ok">Hebat! Kamu benar '+s+' dari '+SORT.length+' pada percobaan pertama.</div>';return}
 var it=SORT[n];box.innerHTML='<div class="ico" style="font-size:4rem">'+it[0]+'</div><p style="text-align:center;font-weight:800">'+it[1]+'</p><div class="grid">'+'<button class="btn" data-x="a">🌿 ALAMI</button><button class="btn" data-x="b">🏗️ BUATAN</button></div><div class="fb" style="display:none"></div>';
 var tried=false;box.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){var f=box.querySelector(".fb");f.style.display="block";
  if(b.dataset.x==it[2]){f.className="fb ok";f.innerHTML="Benar! "+it[1]+" itu "+(it[2]=="a"?"alami":"buatan")+".";setTimeout(function(){sort(n+1,s+(tried?0:1))},1000)}
  else{tried=true;f.className="fb no";f.innerHTML="Belum tepat. Tanyakan: siapa yang membentuknya?"}}})}
function quiz(i){var q=Q[i],h='<h2>Kuis: Soal '+(i+1)+' dari '+Q.length+'</h2><p style="font-weight:800;font-size:1.15rem">'+q.q+'</p><div id="opts">';
 q.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+L[k]+'. '+o+'</button>'});
 h+='</div><div id="fb"></div><div class="nav">'+btn("◀ MENU","menu")+'</div>';show(h);
 var opts=view.querySelectorAll(".opt"),fb=document.getElementById("fb");
 opts.forEach(function(b){b.onclick=function(){var k=+b.dataset.k;
  if(k==q.c){opts.forEach(function(x){x.disabled=true});b.classList.add("ok");
   fb.innerHTML='<div class="fb ok">🎉 Benar! '+q.w+'</div><div class="nav"><span></span>'+btn(i<Q.length-1?"LANJUT ▶":"SELESAI ▶",i<Q.length-1?"quiz:"+(i+1):"end")+'</div>';
   fb.querySelector("[data-a]").onclick=function(){act(this.dataset.a)}}
  else{missed[i]=1;b.classList.add("no");b.disabled=true;
   fb.innerHTML='<div class="fb no">Belum tepat. '+q.h+'</div><div class="nav">'+btn("COBA LAGI","quiz:"+i)+btn("📖 MATERI","mat:"+q.m+":"+i)+'</div>';
   fb.querySelectorAll("[data-a]").forEach(function(x){x.onclick=function(){if(x.dataset.a.indexOf("quiz")==0){fb.innerHTML=""}else act(x.dataset.a)}})}}})}
function end(){var s=Q.length-Object.keys(missed).length;
 show('<h2>Selamat, petualanganmu selesai!</h2>'+say("Kamu hebat! Kamu sudah tahu beda ketampakan alam alami dan buatan.")+'<div style="text-align:center;margin:12px 0"><div>Benar pada percobaan pertama</div><div class="score">'+s+' / '+Q.length+'</div></div><div class="key">⭐ Alami dibentuk alam, buatan dibuat manusia. Mari jaga keduanya: buang sampah pada tempatnya!</div><div class="nav">'+btn("🔁 ULANGI","menu")+btn("MENU UTAMA","menu")+'</div>');
 var c=["#ffd84d","#d62f2f","#fff","#3fa34d"];for(var k=0;k<50;k++){var e=document.createElement("i");e.className="conf";e.style.left=Math.random()*100+"vw";e.style.background=c[k%4];e.style.animationDuration=2+Math.random()*2.5+"s";e.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(e);setTimeout(function(x){x.remove()},6000,e)}}
cover();
</script>
</body>
</html>
